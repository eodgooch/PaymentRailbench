# Every Settlement Report Fault (SPEC §4.5, §6, ADR 0014). Four buyers fund by ACH pull on
# Thursday afternoon; their pulls settle Friday 08:30 New York, but Rosa's settlement
# webhook is delivered five days late. Wren buys Ottoline's card at
# the 17:00 Auction Close for 300.00, and Ottoline's Instant Payout of 270.00 (less
# Mintwharf's fictional 10% fee) goes out over RTP at once, before the 18:00 RTP Cutoff.
# Expected Settlement Reports (one per Banking Day; Monday 7 September is Labor Day):
# - Thursday 3: Ottoline's Payout, -27000;
# - Friday 4: Wren's pull reported as 59500, 500 short of what settled (wrong amount); Pax's
#   pull left off (missing line); a Provider Adjustment at noon recalling 20.00 of
#   Ottoline's Payout, +2000;
# - Friday 4 also lists Rosa's pull, 5000;
# - Tuesday 8: Jules's pull, booked at Friday's 16:00 ACH Cutoff, so on the next Banking
#   Day's report after a Fed holiday (settlement after Cutoff); a fee correction of 1.00
#   against Rosa's pull; and a fee correction of 4.50 against a Payment the Provider never
#   made for Mintwharf (an orphan adjustment);
# - Wednesday 9: a fee correction of 1.50 against Wren's pull, -150.
# Expected Ledger:
# - the missing, wrong and late lines change no balance: every pull is booked as its
#   Provider Events said;
# - the recall is booked against Ottoline's Payout: Bank Cash +2000, her Customer Balance
#   +2000 (Mintwharf owes her that part again);
# - the fee correction is booked against Wren's pull: Bank Cash -150, Provider Fees +150;
# - Rosa's fee correction arrives before the Ledger has heard her pull settled: it's kept
#   pending, then booked once the late webhook lands on Wednesday 9 at 08:30 New York;
# - the orphan adjustment is stored unmatched and books nothing;
# - Bank Cash ends at 59750, Provider Fees at 250; every Clearing Account nets to zero;
# - the Fault Manifest names every report Fault; replaying reproduces the Ledger.
name: settlement-report-faults
